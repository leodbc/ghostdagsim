name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NS3_VERSION: "3.46.1"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Unit Tests (GhostDAG + Mempool) [diagnostics=${{ matrix.diagnostics }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - diagnostics: "off"
            diagnostics_cmake: "OFF"
          - diagnostics: "on"
            diagnostics_cmake: "ON"

    permissions:
      contents: read
      packages: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (for cache pulls)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: ghostdagsim-test:ci-${{ matrix.diagnostics }}
          build-args: |
            NS3_VERSION=${{ env.NS3_VERSION }}
            GHOSTDAGSIM_DIAGNOSTICS=${{ matrix.diagnostics_cmake }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cache:test-builder
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cache:test-builder,mode=max

      - name: Run ghostdagtest
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/results:/results \
            ghostdagsim-test:ci-${{ matrix.diagnostics }} \
            /usr/local/bin/ghostdagtest \
            --gtest_output=xml:/results/ghostdagtest-results.xml

      - name: Run mempooltest
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/results:/results \
            ghostdagsim-test:ci-${{ matrix.diagnostics }} \
            /usr/local/bin/mempooltest \
            --gtest_output=xml:/results/mempooltest-results.xml

      - name: Run simulator smoke
        run: |
          rm -rf "diag-results-${{ matrix.diagnostics }}"
          mkdir -p "diag-results-${{ matrix.diagnostics }}"
          docker run --rm \
            -v "${{ github.workspace }}/diag-results-${{ matrix.diagnostics }}:/results" \
            ghostdagsim-test:ci-${{ matrix.diagnostics }} \
            mpirun --allow-run-as-root -np 1 \
            /usr/local/bin/ghostdagsim \
            --nodes=20 \
            --miners=10 \
            --blocks_per_miner=1 \
            --lambda=0.5 \
            --tx_gen_interval=0.1 \
            --snapshot_interval=0.1 \
            --run_name=diagnostics-ci-${{ matrix.diagnostics }}

      - name: Validate diagnostics artifact
        if: matrix.diagnostics == 'on'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("diag-results-on/diagnostics-ci-on/rank0/diagnostics.json")
          assert p.is_file(), p
          data = json.loads(p.read_text())
          assert data["diagnostic_only"] is True
          assert data["schema"] == "ghostdagsim.gateb.diagnostics"
          assert data["schema_version"] == 1
          assert data["rank"] == 0
          assert data["mpi_size"] == 1
          assert data["process_timing"]["interval"] == "Simulator::Run"
          assert "counters" in data and "timers_ns" in data
          PY

      - name: Validate diagnostics disabled
        if: matrix.diagnostics == 'off'
        run: |
          test ! -e "diag-results-off/diagnostics-ci-off/rank0/diagnostics.json"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ matrix.diagnostics }}
          path: "results/*-results.xml"
          retention-days: 14

      - name: Publish test summary
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "results/*-results.xml"
          check_name: "GhostDAG Unit Tests [diagnostics=${{ matrix.diagnostics }}]"
          comment_mode: off

  profile-image-smoke:
    name: Stage A3 CPU Profiler Smoke
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Stage A3 scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/run-cpu-profile.py
          sh -n scripts/profile-rank.sh
          python3 scripts/run-cpu-profile.py --help >/dev/null

      - name: Build Stage A3 portable image
        run: |
          set -euo pipefail
          docker build \
            --file experiments/portable.Dockerfile \
            --build-arg NS3_VERSION=3.46.1 \
            --build-arg GHOSTDAGSIM_DIAGNOSTICS=ON \
            --build-arg GHOSTDAGSIM_CPU_PROFILER=ON \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag ghostdagsim-stagea3-smoke:ci \
            .

      - name: Verify profiler tooling and labels
        run: |
          set -euo pipefail
          test "$(docker image inspect ghostdagsim-stagea3-smoke:ci --format '{{ index .Config.Labels "io.ghostdagsim.cpu_profiler" }}')" = "ON"
          docker run --rm --entrypoint sh ghostdagsim-stagea3-smoke:ci -ec '
            command -v google-pprof
            ldconfig -p | grep -q "libprofiler.so.0"
            nm -C /usr/local/bin/ghostdagsim | grep -q "GhostDagNode::"
          '

      - name: Deterministic CPU profile symbolization smoke
        run: |
          set -euo pipefail
          rm -rf profile-smoke
          mkdir -p profile-smoke

          # Produce one genuine non-empty gperftools profile through a normal
          # simulator exit. Avoid CPUPROFILESIGNAL here: hosted CI has shown
          # nondeterministic signal/flush timing, while the real Stage A3 run
          # already proved signal-controlled raw-profile capture on all ranks.
          docker run --rm \
            -v "$PWD/profile-smoke:/profile" \
            --entrypoint sh \
            ghostdagsim-stagea3-smoke:ci -ec '
              set -eu
              libprofiler="$(ldconfig -p | awk '"'"'/libprofiler\.so\.0/{print $NF; exit}'"'"')"
              test -n "$libprofiler"
              mkdir -p /profile/cpu-profile/rank0
              mpirun --allow-run-as-root -np 1 \
                env \
                  CPUPROFILE=/profile/cpu-profile/rank0/cpu.prof \
                  CPUPROFILE_FREQUENCY=100 \
                  LD_PRELOAD="$libprofiler" \
                /usr/local/bin/ghostdagsim \
                  --nodes=20 --miners=10 --blocks_per_miner=5 \
                  --lambda=20 --tx_gen_interval=0.5 --snapshot_interval=30 \
                  --run_name=stagea3-symbolization-smoke

              raw="$(find /profile/cpu-profile/rank0 -maxdepth 1 -type f -name "cpu.prof*" -size +0c -print -quit)"
              test -n "$raw"
              for rank in 1 2 3; do
                mkdir -p "/profile/cpu-profile/rank$rank"
                cp "$raw" "/profile/cpu-profile/rank$rank/cpu.prof.0"
              done
            '

          # Raw rank directories/files are root-owned because they were created
          # by the container, reproducing the production ownership boundary.
          test "$(stat -c %u profile-smoke/cpu-profile/rank0)" = "0"

          python3 - <<'PY'
          from pathlib import Path
          import runpy
          import time

          scope = runpy.run_path(
              "scripts/run-cpu-profile.py",
              run_name="stagea3_smoke_symbolizer",
          )
          root = Path("profile-smoke")
          profiles = {
              rank: next((root / "cpu-profile" / f"rank{rank}").glob("cpu.prof*"))
              for rank in range(4)
          }
          outputs = scope["symbolize_profiles"](
              "ghostdagsim-stagea3-smoke:ci",
              root,
              profiles,
              deadline_at=time.monotonic() + 180,
          )
          expected = {
              str(rank): f"symbolized/rank{rank}/pprof.txt"
              for rank in range(4)
          }
          assert outputs == expected, outputs
          for rank in range(4):
              path = root / "symbolized" / f"rank{rank}" / "pprof.txt"
              assert path.is_file() and path.stat().st_size > 0, path
          PY
