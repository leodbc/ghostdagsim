name: Phase 5 Gate B Diagnostics

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_PHASE5_GATEB_DIAGNOSTICS after reviewing the diagnostic execution contract"
        required: true
        type: string
      host_load_attestation:
        description: "Type HOST_IDLE_LOW_CONFIRMED after confirming unrelated physical-host workload is idle/low"
        required: true
        type: string
      authorized_sha:
        description: "Exact full master SHA authorized for this diagnostic execution"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase5-gateb-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Gate B D100 then D1000 diagnostic execution
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, ghostdagsim-phase4]
    timeout-minutes: 180

    env:
      AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
      ARTIFACT_ROOT: ${{ runner.temp }}/phase5-gateb-${{ github.run_id }}-${{ github.run_attempt }}
      LOCAL_IMAGE_TAG: ghostdagsim:phase5-gateb-local

    steps:
      - name: Enforce manual execution authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_PHASE5_GATEB_DIAGNOSTICS"
          test "${{ inputs.host_load_attestation }}" = "HOST_IDLE_LOW_CONFIRMED"
          test "$GITHUB_REF" = "refs/heads/master"
          [[ "$AUTHORIZED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$AUTHORIZED_SHA"

      - name: Checkout authorized source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorized_sha }}
          fetch-depth: 1

      - name: Verify checked-out source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"

      - name: Initialize diagnostic execution context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          from datetime import datetime, timezone

          root = pathlib.Path(os.environ["ARTIFACT_ROOT"])
          context = {
              "schema_version": 1,
              "execution_class": "diagnostic",
              "phase": "Phase 5 Gate B",
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "github_ref": os.environ["GITHUB_REF"],
              "github_sha": os.environ["GITHUB_SHA"],
              "authorized_sha": os.environ["AUTHORIZED_SHA"],
              "runner_name": os.environ["RUNNER_NAME"],
              "host_load_attestation": "HOST_IDLE_LOW_CONFIRMED",
              "guest_loadavg_before": pathlib.Path("/proc/loadavg").read_text().strip(),
              "started_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "finished_at": None,
              "guest_loadavg_after": None,
              "cells": [
                  {"diagnostic_id": "D100", "mpi": 4, "rng_seed": 1, "rng_run": 1,
                   "simulation_timeout_seconds": 1200, "harness_deadline_seconds": 1800},
                  {"diagnostic_id": "D1000", "mpi": 4, "rng_seed": 1, "rng_run": 1,
                   "simulation_timeout_seconds": 3600, "harness_deadline_seconds": 4500},
              ],
          }
          (root / "execution-context.json").write_text(
              json.dumps(context, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Validate approved Phase 4 runner without canonical image binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import runpy

          approval_path = pathlib.Path("experiments/runner-approval.json")
          scope = runpy.run_path("scripts/validate-runner.py", run_name="phase5_gateb_runner_validation")
          approval = scope["load_approval"](approval_path)
          observed = scope["observe_runner"]()
          scope["verify_identity"](approval, observed)
          scope["verify_native_mpi4"]()

          evidence = {
              "schema_version": 1,
              "status": "verified",
              "dedicated_label": approval["dedicated_label"],
              **observed,
              "native_mpi4_probe": "pass",
              "runner_approval_sha256": hashlib.sha256(approval_path.read_bytes()).hexdigest(),
              "acceptance_workflow_run_id": approval["acceptance_workflow_run_id"],
          }
          out = pathlib.Path(os.environ["ARTIFACT_ROOT"]) / "runner-evidence.json"
          out.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Build one local diagnostic image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"
          test -z "$(git status --porcelain)"
          docker build \
            --file experiments/portable.Dockerfile \
            --build-arg NS3_VERSION=3.46.1 \
            --build-arg GHOSTDAGSIM_DIAGNOSTICS=ON \
            --label "org.opencontainers.image.revision=$AUTHORIZED_SHA" \
            --tag "$LOCAL_IMAGE_TAG" \
            . 2>&1 | tee "$ARTIFACT_ROOT/build.log"

      - name: Pin and verify local diagnostic image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$LOCAL_IMAGE_TAG" > "$ARTIFACT_ROOT/image-inspect.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["ARTIFACT_ROOT"])
          data = json.loads((root / "image-inspect.json").read_text(encoding="utf-8"))
          if not isinstance(data, list) or len(data) != 1 or not isinstance(data[0], dict):
              raise SystemExit("expected exactly one local image inspect object")
          image = data[0]
          image_id = image.get("Id")
          if not isinstance(image_id, str) or not image_id.startswith("sha256:") or len(image_id) != 71:
              raise SystemExit(f"invalid local image ID: {image_id!r}")
          labels = (image.get("Config") or {}).get("Labels") or {}
          expected = {
              "org.opencontainers.image.revision": os.environ["AUTHORIZED_SHA"],
              "io.ghostdagsim.diagnostics": "ON",
              "io.ghostdagsim.metrics": "on",
              "io.ghostdagsim.ns3.build_profile": "optimized",
              "io.ghostdagsim.ns3.native_optimizations": "off",
              "io.ghostdagsim.ns3.version": "3.46.1",
          }
          for key, value in expected.items():
              if labels.get(key) != value:
                  raise SystemExit(
                      f"image label mismatch for {key}: expected={value!r}, observed={labels.get(key)!r}"
                  )

          provenance = {
              "schema_version": 1,
              "execution_class": "diagnostic",
              "source_sha": os.environ["AUTHORIZED_SHA"],
              "dockerfile": "experiments/portable.Dockerfile",
              "ns3_version": "3.46.1",
              "build_profile": "optimized",
              "metrics_enabled": True,
              "diagnostics_enabled": True,
              "native_optimizations": False,
              "local_image_id": image_id,
              "image_reference_type": "local_image_id",
              "image_revision": labels["org.opencontainers.image.revision"],
          }
          (root / "build-provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"image_id={image_id}\n")
          print(json.dumps(provenance, indent=2, sort_keys=True))
          PY

      - name: Execute D100 then conditionally D1000
        env:
          LOCAL_IMAGE_ID: ${{ steps.image.outputs.image_id }}
        shell: bash
        run: |
          set -uo pipefail

          cleanup_diag_containers() {
            docker rm -f \
              "ghostdagsim-phase5-d100-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              "ghostdagsim-phase5-d1000-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              >/dev/null 2>&1 || true
          }
          trap cleanup_diag_containers EXIT INT TERM

          printf "cell\tstatus\texit_code\n" > "$ARTIFACT_ROOT/cell-exit-codes.tsv"

          d100_rc=0
          python3 scripts/run-diagnostic.py \
            --scenario experiments/scenarios/diagnostic-d100.json \
            --image-id "$LOCAL_IMAGE_ID" \
            --mpi-threads 4 \
            --rng-seed 1 \
            --rng-run 1 \
            --timeout-seconds 1200 \
            --harness-deadline-seconds 1800 \
            --runner-evidence "$ARTIFACT_ROOT/runner-evidence.json" \
            --results-root "$ARTIFACT_ROOT/D100" \
            --source-sha "$AUTHORIZED_SHA" || d100_rc=$?

          d100_gate=0
          python3 - <<'PY' || d100_gate=$?
          import json
          import os
          import pathlib
          manifest = json.loads(
              (pathlib.Path(os.environ["ARTIFACT_ROOT"]) / "D100" / "manifest.json").read_text(encoding="utf-8")
          )
          if manifest.get("status") != "completed":
              raise SystemExit("D100 status is not completed")
          if manifest.get("exit_code") != 0:
              raise SystemExit("D100 exit_code is not zero")
          if (manifest.get("output_integrity") or {}).get("status") != "complete":
              raise SystemExit("D100 output_integrity is not complete")
          PY

          d100_status="completed"
          if (( d100_rc != 0 || d100_gate != 0 )); then
            d100_status="failed"
          fi
          printf "D100\t%s\t%s\n" "$d100_status" "$d100_rc" >> "$ARTIFACT_ROOT/cell-exit-codes.tsv"

          if (( d100_rc != 0 || d100_gate != 0 )); then
            printf "D1000\tskipped_d100_gate\t-\n" >> "$ARTIFACT_ROOT/cell-exit-codes.tsv"
            if (( d100_rc != 0 )); then
              exit "$d100_rc"
            fi
            exit 1
          fi

          d1000_rc=0
          python3 scripts/run-diagnostic.py \
            --scenario experiments/scenarios/diagnostic-d1000.json \
            --image-id "$LOCAL_IMAGE_ID" \
            --mpi-threads 4 \
            --rng-seed 1 \
            --rng-run 1 \
            --timeout-seconds 3600 \
            --harness-deadline-seconds 4500 \
            --runner-evidence "$ARTIFACT_ROOT/runner-evidence.json" \
            --results-root "$ARTIFACT_ROOT/D1000" \
            --source-sha "$AUTHORIZED_SHA" || d1000_rc=$?

          d1000_gate=0
          python3 - <<'PY' || d1000_gate=$?
          import json
          import os
          import pathlib
          manifest = json.loads(
              (pathlib.Path(os.environ["ARTIFACT_ROOT"]) / "D1000" / "manifest.json").read_text(encoding="utf-8")
          )
          if manifest.get("status") != "completed":
              raise SystemExit("D1000 status is not completed")
          if manifest.get("exit_code") != 0:
              raise SystemExit("D1000 exit_code is not zero")
          if (manifest.get("output_integrity") or {}).get("status") != "complete":
              raise SystemExit("D1000 output_integrity is not complete")
          PY

          d1000_status="completed"
          if (( d1000_rc != 0 || d1000_gate != 0 )); then
            d1000_status="failed"
          fi
          printf "D1000\t%s\t%s\n" "$d1000_status" "$d1000_rc" >> "$ARTIFACT_ROOT/cell-exit-codes.tsv"
          if (( d1000_rc != 0 )); then
            exit "$d1000_rc"
          fi
          exit "$d1000_gate"

      - name: Record final guest load
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT"
          cat /proc/loadavg | tee "$ARTIFACT_ROOT/guest-loadavg-after.txt"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          from datetime import datetime, timezone

          path = pathlib.Path(os.environ["ARTIFACT_ROOT"]) / "execution-context.json"
          if not path.exists():
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          data["guest_loadavg_after"] = pathlib.Path("/proc/loadavg").read_text().strip()
          data["finished_at"] = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload Gate B diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-gateb-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_ROOT }}/
          if-no-files-found: warn
          retention-days: 30
